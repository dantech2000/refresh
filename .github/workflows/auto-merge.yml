name: Auto-merge Dependabot PRs

on:
  pull_request:
    types: [opened, synchronize, reopened]

# A new push to the PR starts a new run, which decides on its own head
# commit; the superseded run stops polling.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    # Above the 40-minute wait for the checks below, which covers Race stress
    # (25-minute timeout) and the time a job can spend in the queue.
    timeout-minutes: 45
    if: github.actor == 'dependabot[bot]'

    steps:
      # fetch-metadata v2.4+ verifies the Dependabot commit signature by shelling
      # out to git, so the repo must be checked out first or it exits 1 with
      # "fatal: not a git repository".
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Authoritative metadata from Dependabot itself — the previous title regex
      # let major bumps through because `.*` swallowed the major component. (REF-60)
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Only Go module and uv (docs site) bumps merge without a person. A
      # GitHub Actions bump is never merged here: actions such as
      # goreleaser-action and cosign-installer run in release.yml with
      # `contents: write`, `id-token: write`, and GH_PAT, and no check of the
      # PR runs release.yml, so passing checks prove nothing about them.
      - name: Determine eligibility (Go modules or uv, patch/minor only)
        id: check
        env:
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          echo "update-type: $UPDATE_TYPE"
          echo "package-ecosystem: $ECOSYSTEM"
          eligible=false
          case "$ECOSYSTEM" in
            go_modules | uv)
              if [[ "$UPDATE_TYPE" == "version-update:semver-patch" || \
                    "$UPDATE_TYPE" == "version-update:semver-minor" ]]; then
                eligible=true
              fi
              ;;
          esac
          echo "eligible=$eligible" >> "$GITHUB_OUTPUT"

      # Every check of the head commit must pass, not a chosen few: with no
      # branch protection nothing else enforces them. `gh pr checks --watch`
      # cannot be used, because it would also wait for this job, which is a
      # check of the same commit. So the loop polls, leaves out the checks of
      # this workflow, and waits until none is pending. The checks of the
      # other workflows may not exist yet when this job starts, so the loop
      # also waits until each check named in `required` has appeared, and
      # each of those must pass.
      - name: Wait for every check of the head commit
        if: steps.check.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SELF: ${{ github.workflow }}
          ECOSYSTEM: ${{ steps.meta.outputs.package-ecosystem }}
        run: |
          required=("Run go test" "Race stress (shuffled, x5)" "Run govulncheck" "Run deadcode" "Binary size" "Run golangci-lint")
          if [ "$ECOSYSTEM" = "uv" ]; then
            required+=("Build site")
          fi
          deadline=$((SECONDS + 2400))
          while :; do
            # With --json, gh prints the checks and does not use the exit
            # code for pending or failed checks. A failed call (no checks
            # reported yet, a transient API error) is retried.
            if checks="$(gh pr checks "$PR" --json name,bucket,workflow \
                --jq "[.[] | select(.workflow != \"$SELF\")]")"; then
              failed="$(jq -r '.[] | select(.bucket == "fail" or .bucket == "cancel") | .name' <<<"$checks")"
              if [ -n "$failed" ]; then
                echo "::error::A check failed or was cancelled; not merging:"
                echo "$failed"
                exit 1
              fi
              # A required check must pass. Skipped or neutral is not a pass:
              # this gate is the only one, so a required check that did not
              # run fails it. One that is absent or pending is waited for.
              missing=()
              for name in "${required[@]}"; do
                if jq -e --arg n "$name" 'any(.[]; .name == $n and .bucket == "pass")' <<<"$checks" >/dev/null; then
                  continue
                fi
                ended="$(jq -r --arg n "$name" '.[] | select(.name == $n and .bucket != "pending") | .bucket' <<<"$checks")"
                if [ -n "$ended" ]; then
                  echo "::error::The required check \"$name\" ended as ${ended//$'\n'/, }, not pass; not merging."
                  exit 1
                fi
                missing+=("$name")
              done
              pending="$(jq -r '.[] | select(.bucket == "pending") | .name' <<<"$checks")"
              if [ ${#missing[@]} -eq 0 ] && [ -z "$pending" ]; then
                echo "Every required check passed, and no check failed:"
                jq -r '.[] | "  \(.bucket)\t\(.workflow) / \(.name)"' <<<"$checks"
                exit 0
              fi
              echo "Waiting: pending=[${pending//$'\n'/, }] required, not passed yet=[${missing[*]}]"
            else
              echo "Could not read the checks; retrying."
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::The checks did not finish in 40 minutes; not merging."
              exit 1
            fi
            sleep 30
          done

      # GH_PAT, not GITHUB_TOKEN, and ONLY on this step. GitHub does not trigger
      # workflows from pushes made with GITHUB_TOKEN (its recursion guard), so
      # merging with it lands dep bumps on main with NO Test/Lint run and NO
      # Release Please run — meaning `fix(deps)` commits never cut a release.
      # Merging as a real user restores both. release-please.yml uses GH_PAT for
      # the same reason. Every other step here stays on the scoped, auto-rotating
      # GITHUB_TOKEN — they only read metadata and checks.
      - name: Auto-merge Dependabot PR
        if: steps.check.outputs.eligible == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          echo "Every check passed. Merging Dependabot PR..."
          # A direct merge, NOT `--auto`. GitHub's auto-merge is disabled on this
          # repo (allow_auto_merge=false), so `--auto` failed with "Auto merge is
          # not allowed for this repository (enablePullRequestAutoMerge)" whenever
          # the PR was not already mergeable — which is why dep PRs piled up.
          # Enabling the repo setting would be the other fix, but it is worse: with
          # no branch protection there are no REQUIRED checks, so repo-wide
          # auto-merge would merge any PR the moment it is mergeable, checks or not.
          # We do not need it — the wait step above already proves every check
          # passed before we get here, so merging now is equivalent and fails
          # loudly on conflict instead of queueing silently.
          #
          # --match-head-commit: the checks were read for the PR's head at the
          # time. If Dependabot pushed again since, the merge is refused, and
          # the run of that push decides on its own checks.
          #
          # Retried, because `mergePullRequest` rejects with "Base branch was
          # modified" when another PR lands on main between GitHub computing
          # mergeability and this call — a real race whenever several Dependabot
          # PRs are in flight at once (it stranded #115). The failure is transient:
          # GitHub recomputes the merge on the next attempt. A retry matters more
          # here than elsewhere because nothing re-drives a stranded PR — this
          # workflow only fires on opened/synchronize/reopened, so a PR that loses
          # the race sits open until someone merges it by hand.
          for attempt in 1 2 3 4 5; do
            if gh pr merge "$PR" --squash --delete-branch --match-head-commit "$HEAD_SHA"; then
              echo "Merged on attempt ${attempt}."
              exit 0
            fi

            # Someone (or a concurrent run) got there first — not an error.
            if [ "$(gh pr view "$PR" --json state -q .state)" = "MERGED" ]; then
              echo "PR #${PR} is already merged."
              exit 0
            fi

            # A new head commit has its own run of this workflow.
            if [ "$(gh pr view "$PR" --json headRefOid -q .headRefOid)" != "$HEAD_SHA" ]; then
              echo "::error::PR #${PR} has a new head commit; its own run decides."
              exit 1
            fi

            # A genuine conflict will not resolve by retrying. Dependabot rebases
            # itself and re-fires this workflow, so bail out and let it.
            mergeable="$(gh pr view "$PR" --json mergeable -q .mergeable)"
            if [ "$mergeable" = "CONFLICTING" ]; then
              echo "::error::PR #${PR} has merge conflicts; leaving it for Dependabot to rebase."
              exit 1
            fi

            echo "Merge attempt ${attempt} failed (mergeable=${mergeable}); retrying in $((attempt * 10))s..."
            sleep $((attempt * 10))
          done

          echo "::error::Could not merge PR #${PR} after 5 attempts."
          exit 1

      - name: Comment on non-eligible PR
        if: steps.check.outputs.eligible == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR" --body "⚠️ This Dependabot PR requires manual review (a GitHub Actions bump, a major version update, or a non-version change)."
