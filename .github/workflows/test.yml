name: Test

# PRs run every job. A push to main runs only the `test` job, because Codecov
# needs coverage from main as the base for PR patch/project comparisons. The
# other jobs already passed on the PR, so they skip on push.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel superseded runs when new commits are pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run go test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Resolve the Go version from go.mod so CI never drifts from the
          # module's declared toolchain.
          go-version-file: go.mod
          cache: true

      # We intentionally do NOT run a separate non-race `go build ./...`. Go's
      # build cache keys on -race, so a non-race build shares zero cached
      # compilation with the race test below — it just compiles the (large)
      # AWS-SDK/k8s tree a second time. Compilation is fully covered by the
      # race steps: `go run -race . gen-docs` builds the main binary, and
      # `go test -race ./...` compiles every package (even test-less ones).
      # `go vet` is covered by golangci-lint's govet linter (lint.yml). (REF-135)

      - name: go.mod and go.sum are tidy
        run: |
          if ! go mod tidy -diff; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit."
            exit 1
          fi

      - name: Docs command reference and JSON schemas are up to date
        # `-race` so this shares one race compile of the dependency tree with the
        # Test step's cache, instead of adding a separate non-race compile pass.
        run: |
          go run -race . gen-docs --out docs/reference --schema-out docs/schema/v1
          # `git status`, not `git diff`, so a new, untracked page also fails.
          if [ -n "$(git status --porcelain -- docs/reference docs/schema)" ]; then
            echo "::error::docs/reference or docs/schema is stale vs the CLI tree and the Go types. Run 'task docs:gen' and commit."
            git status --short -- docs/reference docs/schema
            git --no-pager diff -- docs/reference docs/schema
            exit 1
          fi

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  race-stress:
    name: Race stress (shuffled, x5)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Repeated, shuffled runs surface order-dependent tests and data races
      # that one pass in declaration order can hide. The seed is printed in the
      # log; reproduce a failure with `go test -race -shuffle=<seed> ./<pkg>`.
      - name: Test (race, shuffled, x5)
        run: go test -race -count=5 -shuffle=on -timeout=20m ./...

  govulncheck:
    name: Run govulncheck
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.3.0
          govulncheck ./...

  deadcode:
    name: Run deadcode
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # `-test` counts every test as an entry point, so legitimate test-only
      # seams (deterministic constructors, mock builders) are not flagged —
      # only code unreachable from production AND tests. deadcode exits 0 even
      # when it finds something, so fail the step on any output.
      - name: deadcode
        run: |
          go install golang.org/x/tools/cmd/deadcode@v0.46.0
          out="$(deadcode -test ./...)"
          if [ -n "$out" ]; then
            echo "::error::dead code found (unreachable even from tests):"
            echo "$out"
            exit 1
          fi
          echo "No dead code."
