name: Test

# PRs run every job. A push to main runs only the `test` job, because Codecov
# needs coverage from main as the base for PR patch/project comparisons. The
# other jobs already passed on the PR, so they skip on push.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel superseded runs when new commits are pushed to the same PR. A run on
# main is never cancelled: it uploads the Codecov base and saves the caches,
# and two merges close together would otherwise cancel the first.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Run go test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Resolve the Go version from go.mod so CI never drifts from the
          # module's declared toolchain.
          go-version-file: go.mod
          # One setup-go cache key for every job meant that the job that ended
          # first (govulncheck, with no race objects) wrote it, and the race
          # jobs compiled from nothing. Each job now restores the caches that
          # fit what it builds:
          #   go-mod-*   the module cache; every Go job restores it.
          #   go-race-*  the build cache of -race compiles; this job and
          #              Race stress restore it.
          # Only this job saves them, and only on main (a PR cache serves no
          # other PR), or when nothing at all was restored. restore-keys lets
          # a PR that changes go.sum start from the cache of main.
          cache: false

      - name: Restore the module cache
        id: mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-

      - name: Restore the race build cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-race-${{ runner.os }}-

      # We intentionally do NOT run a separate non-race `go build ./...`. Go's
      # build cache keys on -race, so a non-race build shares zero cached
      # compilation with the race test below — it just compiles the (large)
      # AWS-SDK/k8s tree a second time. Compilation is fully covered by the
      # race steps: `go run -race ./cmd/refresh gen-docs` builds the main binary, and
      # `go test -race ./...` compiles every package (even test-less ones).
      # `go vet` is covered by golangci-lint's govet linter (lint.yml). (REF-135)

      - name: go.mod and go.sum are tidy
        run: |
          if ! go mod tidy -diff; then
            echo "::error::go.mod/go.sum are not tidy. Run 'go mod tidy' and commit."
            exit 1
          fi

      - name: Docs command reference and JSON schemas are up to date
        # `-race` so this shares one race compile of the dependency tree with the
        # Test step's cache, instead of adding a separate non-race compile pass.
        run: |
          go run -race ./cmd/refresh gen-docs --out docs/reference
          go run -race ./tools/genschema --out api/schema/v2
          # `git status`, not `git diff`, so a new, untracked page also fails.
          if [ -n "$(git status --porcelain -- docs/reference api/schema)" ]; then
            echo "::error::docs/reference or api/schema is stale vs the CLI tree and the Go types. Run 'task docs:gen' and commit."
            git status --short -- docs/reference api/schema
            git --no-pager diff -- docs/reference api/schema
            exit 1
          fi

      - name: Test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Save the module cache
        if: steps.mod-cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || steps.mod-cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: ${{ steps.mod-cache.outputs.cache-primary-key }}

      - name: Save the race build cache
        if: steps.build-cache.outputs.cache-hit != 'true' && (github.event_name == 'push' || steps.build-cache.outputs.cache-matched-key == '')
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

  race-stress:
    name: Race stress (shuffled, x5)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The caches are the explicit steps below (see the test job).
          cache: false

      - name: Restore the module cache
        id: mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-

      - name: Restore the race build cache
        id: build-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/go-build
          key: go-race-${{ runner.os }}-${{ hashFiles('go.mod', 'go.sum') }}
          restore-keys: go-race-${{ runner.os }}-

      # Repeated, shuffled runs surface order-dependent tests and data races
      # that one pass in declaration order can hide. The seed is printed in the
      # log; reproduce a failure with `go test -race -shuffle=<seed> ./<pkg>`.
      - name: Test (race, shuffled, x5)
        run: go test -race -count=5 -shuffle=on -timeout=20m ./...

  govulncheck:
    name: Run govulncheck
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The caches are the explicit steps below (see the test job).
          cache: false

      - name: Restore the module cache
        id: mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-

      - name: govulncheck
        run: |
          # The one pin is GOVULNCHECK_VERSION in Taskfile.yml.
          version="$(awk '$1 == "GOVULNCHECK_VERSION:" {print $2}' Taskfile.yml)"
          go install "golang.org/x/vuln/cmd/govulncheck@${version:?no GOVULNCHECK_VERSION in Taskfile.yml}"
          govulncheck ./...

  deadcode:
    name: Run deadcode
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # The caches are the explicit steps below (see the test job).
          cache: false

      - name: Restore the module cache
        id: mod-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-${{ runner.os }}-

      # `-test` counts every test as an entry point, so legitimate test-only
      # seams (deterministic constructors, mock builders) are not flagged —
      # only code unreachable from production AND tests. deadcode exits 0 even
      # when it finds something, so fail the step on any output.
      - name: deadcode
        run: |
          # The one pin is DEADCODE_VERSION in Taskfile.yml.
          version="$(awk '$1 == "DEADCODE_VERSION:" {print $2}' Taskfile.yml)"
          go install "golang.org/x/tools/cmd/deadcode@${version:?no DEADCODE_VERSION in Taskfile.yml}"
          out="$(deadcode -test ./...)"
          if [ -n "$out" ]; then
            echo "::error::dead code found (unreachable even from tests):"
            echo "$out"
            exit 1
          fi
          echo "No dead code."

  size:
    name: Binary size
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No cache: this is the only non-race build in CI, and its objects
      # must not go into a build cache that the race jobs restore.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # The same build and check as `task size:check`: the flags and
      # ldflags of .goreleaser.yml. tools/sizecheck.sh explains the limit.
      - name: Release-style binary is within the size limit
        env:
          CGO_ENABLED: "0"
        run: |
          pkg=github.com/dantech2000/refresh/internal/build
          go build -trimpath -ldflags="-s -w -X $pkg.version=$(git describe --tags --always --dirty) -X $pkg.commit=$(git rev-parse --short HEAD) -X $pkg.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o dist/refresh ./cmd/refresh
          sh tools/sizecheck.sh dist/refresh
