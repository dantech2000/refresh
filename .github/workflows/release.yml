name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  # Required for cosign keyless signing via the GitHub OIDC provider. (REF-74)
  id-token: write

jobs:
  goreleaser:
    name: Run GoReleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # SBOM generation (syft) and signing (cosign) used by .goreleaser.yml. (REF-74)
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      # Installer stays on latest; the cosign *binary* is held at v2 on purpose.
      # v4 defaults to Cosign v3, where `sign-blob` requires --bundle and emits a
      # single .sigstore.json instead of the .sig + .pem pair that .goreleaser.yml
      # publishes and docs/getting-started/installation.md tells users to verify.
      # Moving to v3 is a deliberate, user-facing artifact change — tracked separately.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v2.6.1

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # The release itself (creating the GitHub release, uploading assets to
          # THIS repo) runs on the scoped, auto-rotating built-in token. The
          # long-lived PAT is reserved for the cross-repo Homebrew-tap push only
          # — see homebrew_casks.token in .goreleaser.yml. (REF-73)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
