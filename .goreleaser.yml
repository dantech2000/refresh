# GoReleaser config for the 'refresh' CLI tool
# See https://goreleaser.com/customization/ for full docs

version: 2

dist: dist

# The man pages come from the command tree of the source that is released.
# SOURCE_DATE_EPOCH is the commit time, so the date in a page does not change
# from one build of the same commit to the next. The pages go to a directory
# outside dist/, which GoReleaser wants empty. build/ is in .gitignore.
before:
  hooks:
    - rm -rf build/man
    - mkdir -p build/man/man1
    - sh -c 'SOURCE_DATE_EPOCH={{ .CommitTimestamp }} go run -ldflags "-X github.com/dantech2000/refresh/internal/build.version={{ .Version }}" ./cmd/refresh gen-docs --format man --out build/man/man1'

builds:
  - id: refresh
    main: ./cmd/refresh
    binary: refresh
    # Reproducible builds: strip local paths and pin the build timestamp to the
    # commit so the same source produces byte-identical binaries. (REF-74)
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/dantech2000/refresh/internal/build.version={{.Version}}
      - -X github.com/dantech2000/refresh/internal/build.commit={{.ShortCommit}}
      - -X github.com/dantech2000/refresh/internal/build.buildDate={{.Date}}
    env:
      - CGO_ENABLED=0

archives:
  - id: default
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      # man/man1/refresh*.1 in the archive.
      - src: build/man/man1/*.1
        dst: man/man1

checksum:
  name_template: "checksums.txt"

# Software Bill of Materials per archive (syft). (REF-74)
sboms:
  - id: archive
    artifacts: archive

# Keyless signing of the checksums file via cosign + the GitHub OIDC provider.
# No long-lived keys: the signature/certificate are published as release
# artifacts and verifiable with `cosign verify-blob`. (REF-74)
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

changelog:
  sort: desc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

homebrew_casks:
  - name: refresh
    repository:
      owner: dantech2000
      name: homebrew-tap
      branch: main
      token: "{{ .Env.GH_PAT }}"
    directory: Casks
    homepage: "https://github.com/dantech2000/refresh"
    description: "Keep Amazon EKS clusters up to date: status, readiness, patch, upgrade"
    # Homebrew links every man page of the staged archive.
    manpages:
      - man/man1/refresh.1
      - man/man1/refresh-addon.1
      - man/man1/refresh-addon-describe.1
      - man/man1/refresh-addon-list.1
      - man/man1/refresh-addon-update.1
      - man/man1/refresh-cluster.1
      - man/man1/refresh-cluster-describe.1
      - man/man1/refresh-cluster-list.1
      - man/man1/refresh-cluster-rollback.1
      - man/man1/refresh-cluster-upgrade.1
      - man/man1/refresh-cluster-upgrade-check.1
      - man/man1/refresh-completion.1
      - man/man1/refresh-completion-bash.1
      - man/man1/refresh-completion-fish.1
      - man/man1/refresh-completion-powershell.1
      - man/man1/refresh-completion-zsh.1
      - man/man1/refresh-context.1
      - man/man1/refresh-context-add.1
      - man/man1/refresh-context-current.1
      - man/man1/refresh-context-list.1
      - man/man1/refresh-context-remove.1
      - man/man1/refresh-context-use.1
      - man/man1/refresh-nodegroup.1
      - man/man1/refresh-nodegroup-describe.1
      - man/man1/refresh-nodegroup-list.1
      - man/man1/refresh-nodegroup-scale.1
      - man/man1/refresh-nodegroup-update.1
      - man/man1/refresh-status.1
      - man/man1/refresh-ui.1
      - man/man1/refresh-version.1
    license: "MIT"
    # The release binary is not Developer ID-signed, so clear the download
    # quarantine after Homebrew stages it. Homebrew 6.0.22 deprecated the Ruby
    # `postflight` block that `hooks.post.install` emits, so declare the
    # replacement `postflight_steps` stanza through `custom_block` instead.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/refresh"]
        end
      end

release:
  github:
    owner: dantech2000
    name: refresh
