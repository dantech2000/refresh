# Coverage ratchet. The Codecov statuses gate PRs. The upload step in
# .github/workflows/test.yml keeps fail_ci_if_error: false: the repo has no
# CODECOV_TOKEN secret today (uploads are tokenless), so a Codecov outage or
# rate limit must not fail the build itself.
coverage:
  status:
    project:
      default:
        # Compare against the base commit on main and allow a 1% dip.
        target: auto
        threshold: 1%
    patch:
      default:
        # Lines added or changed in the PR.
        target: 70%

# Not product code: the fake world and its servers, the dev tools, and the
# parity runner. Their lines would dilute the ratio that the statuses gate.
ignore:
  - "internal/**/*test/**"
  - "tools/**"
  - "test/**"
