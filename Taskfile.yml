version: '3'

vars:
  BINARY_NAME: refresh
  BUILD_DIR: ./dist
  DEFAULT_CLUSTER: development-blue
  # Tool pins. Keep these in lockstep with .github/workflows/{lint,test}.yml.
  GOLANGCI_LINT_VERSION: v2.13.2
  GOVULNCHECK_VERSION: v1.3.0
  DEADCODE_VERSION: v0.46.0

env:
  CGO_ENABLED: 0
  # Run every go command under the go.mod `toolchain` line, which is the
  # version CI's setup-go resolves via go-version-file. A newer local Go
  # formats and vets differently, so a change can pass locally and still fail
  # CI's gofmt check. A GOTOOLCHAIN already set in the caller's environment
  # wins. With no toolchain line in go.mod, the local Go is used.
  GOTOOLCHAIN:
    sh: echo "${GOTOOLCHAIN:-$(awk '/^toolchain /{print $2; exit}' go.mod | grep . || echo local)}"

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task --list

  # Build tasks
  build:
    desc: Build the binary
    cmds:
      - go build -trimpath -o {{.BUILD_DIR}}/{{.BINARY_NAME}} ./cmd/refresh
    generates:
      - "{{.BUILD_DIR}}/{{.BINARY_NAME}}"

  build:release:
    desc: Build a release-style binary (stripped, with version, commit, and build date)
    cmds:
      - go build -trimpath -ldflags="-s -w -X github.com/dantech2000/refresh/internal/build.version={{.VERSION}} -X github.com/dantech2000/refresh/internal/build.commit={{.COMMIT}} -X github.com/dantech2000/refresh/internal/build.buildDate={{.DATE}}" -o {{.BUILD_DIR}}/{{.BINARY_NAME}} ./cmd/refresh
    vars:
      VERSION:
        sh: git describe --tags --always --dirty
      COMMIT:
        sh: git rev-parse --short HEAD
      DATE:
        sh: date -u +%Y-%m-%dT%H:%M:%SZ
    generates:
      - "{{.BUILD_DIR}}/{{.BINARY_NAME}}"

  # Development tasks
  dev:
    desc: Build and install locally for development
    deps: [build]
    cmds:
      - cp {{.BUILD_DIR}}/{{.BINARY_NAME}} .

  clean:
    desc: Clean build artifacts
    cmds:
      - rm -rf {{.BUILD_DIR}}
      - rm -f {{.BINARY_NAME}}
      - rm -f coverage.out coverage.html

  # Code quality tasks
  fmt:
    desc: Format Go code (gofmt from the go.mod toolchain)
    cmds:
      - go fmt ./...

  lint:
    desc: Run golangci-lint at the CI-pinned version, built with the go.mod toolchain
    cmds:
      # `go run`, not a globally installed binary: a Homebrew golangci-lint is
      # built with the newest Go, and its gofmt formatter follows that Go.
      - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}} run ./...

  vet:
    desc: Run go vet
    cmds:
      - go vet ./...

  vuln:
    desc: Scan for known vulnerabilities (govulncheck)
    cmds:
      - go run golang.org/x/vuln/cmd/govulncheck@{{.GOVULNCHECK_VERSION}} ./...

  deadcode:
    desc: Fail if any function is unreachable even when counting tests as entry points
    cmds:
      # `-test` treats every test as a root, so legitimate test-only seams
      # (e.g. render.New, the mock builders) are NOT flagged — only code that
      # nothing at all reaches. deadcode exits 0 even on findings, so we fail
      # the task ourselves whenever it prints anything.
      - |
        out="$(go run golang.org/x/tools/cmd/deadcode@{{.DEADCODE_VERSION}} -test ./...)"
        if [ -n "$out" ]; then
          echo "dead code found (unreachable even from tests):"
          echo "$out"
          exit 1
        fi
        echo "No dead code."

  test:
    desc: Run tests
    cmds:
      - go test -v ./...

  test:race:
    desc: Run tests with the race detector in shuffled order (CI runs -count=5; override with COUNT=n)
    env:
      CGO_ENABLED: 1 # -race needs cgo
    cmds:
      - go test -race -shuffle=on -count={{.COUNT | default 2}} ./...

  test:live:
    desc: Read-only checks against a real AWS account (AWS_PROFILE); free, never changes anything
    cmds:
      # Every package: a livecheck is a TestLive<Name> function behind the build
      # tag. The pattern leaves out the unit tests of internal/view named
      # TestLive and TestLive_*. The schema check builds ./cmd/refresh itself.
      - go test -tags livecheck -count=1 -v -run '^TestLive[A-Z]' ./internal/... ./tools/...

  test:coverage:
    desc: Run tests with coverage
    cmds:
      - go test -v -coverprofile=coverage.out ./...
      - go tool cover -html=coverage.out -o coverage.html
      - echo "Coverage report generated at coverage.html"

  fuzz:
    desc: Run every Go fuzz target for FUZZTIME each (default 30s; the nightly workflow runs 60s)
    cmds:
      # Targets are found, not listed, so a new FuzzXxx joins automatically.
      # A failing input is saved under the package's testdata/fuzz/<Target>/.
      - |
        for dir in $(grep -rl --include='*_test.go' '^func Fuzz' . | xargs -n1 dirname | sort -u); do
          for target in $(go test -list '^Fuzz' "$dir" | grep '^Fuzz'); do
            echo "== $dir $target"
            go test "$dir" -run '^$' -fuzz "^${target}\$" -fuzztime {{.FUZZTIME | default "30s"}} || exit 1
          done
        done

  test:parity:
    desc: Run the parity suite (the new binary against the recorded traces of the old one)
    cmds:
      - go test -count=1 ./test/parity/...

  bench:
    desc: Run the benchmarks (offline, on the fake world)
    cmds:
      - go test -bench=. -benchmem -run=^$ ./internal/...

  # Documentation site (Material for MkDocs via a uv-managed, hash-locked venv)
  docs:serve:
    desc: Serve the current docs (v2 only) locally with live reload
    cmds:
      - uv run --frozen mkdocs serve

  docs:gen:
    desc: Regenerate the Markdown command reference and the JSON schemas
    cmds:
      - go run ./cmd/refresh gen-docs --out docs/reference
      - go run ./tools/genschema --out api/schema/v2

  docs:check:
    desc: Fail if the committed command reference or JSON schemas are stale (mirrors CI)
    deps: [docs:gen]
    cmds:
      # `git status --porcelain` also catches new, untracked reference pages
      # and schemas.
      - |
        if [ -n "$(git status --porcelain -- docs/reference api/schema)" ]; then
          echo "docs/reference or api/schema is stale vs the CLI tree and the Go types. Commit the regenerated files:"
          git status --short -- docs/reference api/schema
          exit 1
        fi
        echo "docs/reference and api/schema are up to date."

  docs:build:
    desc: Build the published site into site/ (v2, v1 from the 0.16 commit, schemas, redirects)
    deps: [docs:gen]
    cmds:
      - uv run --frozen python tools/mkdocs/build_site.py

  docs:build:current:
    desc: Build the current docs only (strict — fails on broken links/nav)
    deps: [docs:gen]
    cmds:
      - uv run --frozen mkdocs build --strict

  docs:man:
    desc: Generate the man pages to dist/man/man1 (GoReleaser does this in a before-hook)
    cmds:
      - mkdir -p {{.BUILD_DIR}}/man/man1
      - go run ./cmd/refresh gen-docs --format man --out {{.BUILD_DIR}}/man/man1

  # Dependency management
  deps:
    desc: Download and tidy dependencies
    cmds:
      - go mod download
      - go mod tidy

  tidy:check:
    desc: Fail if go.mod/go.sum are not tidy (mirrors CI)
    cmds:
      - go mod tidy -diff

  deps:update:
    desc: Update dependencies
    cmds:
      - go get -u ./...
      - go mod tidy

  # Local testing commands
  run:version:
    desc: Test version command
    deps: [build]
    cmds:
      - ./{{.BUILD_DIR}}/{{.BINARY_NAME}} version

  build:fakefleet:
    desc: Build the fake fleet server (no AWS) to dist/fakefleet
    cmds:
      - go build -o {{.BUILD_DIR}}/fakefleet ./tools/fakefleet
    sources:
      - tools/fakefleet/*.go
      - internal/awsx/awsxtest/*.go
      - internal/fleet/fleettest/*.go
      - internal/kube/kubetest/*.go
    generates:
      - "{{.BUILD_DIR}}/fakefleet"

  run:sim:
    desc: "Run the binary against the fake fleet: task run:sim -- status -A (FAKEFLEET_FLAGS adds flags, such as -speed 10)"
    deps: [build, build:fakefleet]
    interactive: true
    cmds:
      - tools/fakefleet/run.sh {{.BUILD_DIR}}/fakefleet {{.BUILD_DIR}}/{{.BINARY_NAME}} {{.CLI_ARGS}}

  run:tui:sim:
    desc: Open the experimental TUI on the fake fleet (no AWS; FAKEFLEET_FLAGS adds flags, such as -speed 10)
    deps: [build, build:fakefleet]
    interactive: true
    cmds:
      - tools/fakefleet/run.sh {{.BUILD_DIR}}/fakefleet {{.BUILD_DIR}}/{{.BINARY_NAME}} ui -A --allow-changes

  run:help:
    desc: Show help
    deps: [build]
    cmds:
      - ./{{.BUILD_DIR}}/{{.BINARY_NAME}} --help

  run:cluster:list:
    desc: Test cluster list command (requires AWS credentials)
    deps: [build]
    cmds:
      - ./{{.BUILD_DIR}}/{{.BINARY_NAME}} cluster list

  run:ng:list:
    desc: Test nodegroup list command (requires AWS credentials and cluster)
    deps: [build]
    cmds:
      - ./{{.BUILD_DIR}}/{{.BINARY_NAME}} nodegroup list -c {{.DEFAULT_CLUSTER}}

  run:ng:update:dry:
    desc: Test a nodegroup update dry run (requires AWS credentials and cluster)
    deps: [build]
    cmds:
      - ./{{.BUILD_DIR}}/{{.BINARY_NAME}} nodegroup update -c {{.DEFAULT_CLUSTER}} --dry-run

  # Development workflow shortcuts
  dev:quick:
    desc: Quick development test cycle (format, vet, build, version)
    cmds:
      - task: fmt
      - task: vet
      - task: build
      - task: run:version
      - echo "✅ Quick check passed!"

  dev:full:
    desc: Full pre-push check that mirrors CI (fmt, vet, lint, tidy, deadcode, govulncheck, docs, race tests, build)
    cmds:
      - task: fmt
      - task: vet
      - task: lint
      - task: tidy:check
      - task: deadcode
      - task: vuln
      - task: docs:check
      - task: test:race
      - task: build
      - task: run:version
      - task: run:help
      - echo "✅ Full development check passed!"

  # AWS/EKS testing helpers
  aws:check:
    desc: Check AWS credentials and configuration
    cmds:
      - aws sts get-caller-identity
      - aws eks list-clusters --query 'clusters[*]' --output table

  # Release tasks
  release:check:
    desc: Check if ready for release
    cmds:
      - task: dev:full
      - git status --porcelain
      - echo "✅ Ready for release!"

  release:test:
    desc: Test GoReleaser configuration without releasing
    cmds:
      - goreleaser check
      - goreleaser build --snapshot --clean
      - task: release:verify

  release:verify:
    desc: Check that a release-style build prints its version, commit, and build date
    deps: [build:release]
    cmds:
      - |
        out="$(./{{.BUILD_DIR}}/{{.BINARY_NAME}} version)"
        echo "$out"
        echo "$out" | grep -q '^refresh version: v' || { echo "no version"; exit 1; }
        echo "$out" | grep -Eq '^commit: [0-9a-f]{7,}' || { echo "no commit"; exit 1; }
        echo "$out" | grep -Eq '^built: [0-9]{4}-[0-9]{2}-[0-9]{2}T' || { echo "no build date"; exit 1; }

  release:dry:
    desc: Dry run of the full release process
    cmds:
      - goreleaser release --snapshot --clean
